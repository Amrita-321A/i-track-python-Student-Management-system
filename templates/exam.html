<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ test.title }}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f4f6f9; }
        h1 { color: #333; }
        label { display: block; margin-top: 15px; }
        input[type="text"], textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: not-allowed;
            border-radius: 5px;
            opacity: 0.6;
        }
        button.enabled {
            cursor: pointer;
            opacity: 1;
        }
        button.enabled:hover { background-color: #45a049; }

        /* Layout */
        .container {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
        }
        .video-section, .exam-section {
            width: 48%;
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
        .video-section img {
            width: 100%;
            max-width: 640px;
            height: auto;
            border: 2px solid #ccc;
            border-radius: 8px;
        }
        #overlay-message {
            color: red;
            font-weight: bold;
        }
        #alertCount {
            font-weight: bold;
            color: #ff4444;
        }
    </style>
</head>
<body>
    <h1>{{ test.title }}</h1>
    <p>{{ test.description }}</p>

    <div class="container">
        <!-- Webcam feed -->
        <div class="video-section">
            <h3>👁 Eye Tracking Monitor</h3>
            <img id="cameraFeed" src="{{ url_for('video_feed') }}" alt="Webcam Feed">
            <p id="status">Status: Waiting for camera...</p>
            <p>Warnings triggered: <span id="alertCount">0</span></p>
        </div>

        <!-- Exam form -->
        <div class="exam-section">
            <h3>📝 Exam</h3>
            <p id="overlay-message">Please wait... Camera is starting.</p>
            <form id="examForm" method="POST" action="{{ url_for('exam_page', test_id=test.id) }}">
                <input type="hidden" name="status_history" id="status_history">

                <label><b>{{ test.q1 }}</b></label>
                <input type="text" name="q1" required disabled>

                <label><b>{{ test.q2 }}</b></label>
                <textarea name="q2" required style="height:80px;" disabled></textarea>

                <p><b>Time Remaining:</b> <span id="timer">--:--</span></p>

                <button type="submit" id="submitBtn" disabled>Submit Exam</button>
            </form>
        </div>
    </div>

    <script>
    let statusHistory = [];
    let cameraReady = false;
    let timerStarted = false;
    let time = 5 * 60; // 5 minutes
    let warningCount = 0;

    // --- TIMER ---
    function startTimer() {
        if (timerStarted) return;
        timerStarted = true;
        const timerDisplay = document.getElementById('timer');
        const interval = setInterval(function() {
            let minutes = Math.floor(time / 60);
            let seconds = time % 60;
            timerDisplay.textContent = minutes + ":" + (seconds < 10 ? '0' + seconds : seconds);
            time--;
            if (time < 0) {
                clearInterval(interval);
                alert("Time's up! Auto-submitting exam.");
                document.getElementById('examForm').submit();
            }
        }, 1000);
    }

    // --- ALERT BOX ---
    let alertBox = document.createElement("div");
    alertBox.style.position = "fixed";
    alertBox.style.top = "20px";
    alertBox.style.right = "20px";
    alertBox.style.backgroundColor = "#ff4444";
    alertBox.style.color = "white";
    alertBox.style.padding = "10px 20px";
    alertBox.style.borderRadius = "8px";
    alertBox.style.fontWeight = "bold";
    alertBox.style.display = "none";
    alertBox.style.zIndex = "1000";
    alertBox.textContent = "⚠ Please stay attentive!";
    document.body.appendChild(alertBox);

    let warningSound = new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");

    function showAlert() {
        alertBox.style.display = "block";
        warningSound.play();
        setTimeout(() => { alertBox.style.display = "none"; }, 3000);
    }

    // --- STATUS TRACKING ---
    function updateStatus() {
        if (!cameraReady) return;
        fetch("{{ url_for('status') }}")
            .then(response => response.json())
            .then(data => {
                const statusText = data.status; // FIX: use exact case
                document.getElementById('status').textContent = "Status: " + statusText;
                statusHistory.push(statusText);

                // Trigger warning for Drowsy or Not Attentive
                if (statusText !== "Attentive") {
                    warningCount++;
                    document.getElementById('alertCount').textContent = warningCount;
                    showAlert();
                }
            })
            .catch(err => console.error("Status fetch error:", err));
    }
    setInterval(updateStatus, 1000);

    // --- Enable form when camera feed is ready ---
    const cameraFeed = document.getElementById('cameraFeed');
    cameraFeed.onload = function() {
        if (!cameraReady) {
            cameraReady = true;
            document.getElementById('overlay-message').textContent = "Camera active. You may begin your exam.";
            document.querySelectorAll('input, textarea').forEach(el => el.disabled = false);
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = false;
            submitBtn.classList.add('enabled');
            startTimer();
        }
    };

    // --- Attach status history before submission ---
    document.getElementById('examForm').addEventListener('submit', function() {
        document.getElementById('status_history').value = JSON.stringify(statusHistory);
      
    
    });
    </script>
</body>
</html>
