<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Dashboard | iTrack</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Poppins", sans-serif;
  }

  body {
    background: linear-gradient(135deg, #87CEFA, #f0f8ff);
    color: #333;
    min-height: 100vh;
    overflow: hidden;
    position: relative;
  }

  body::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(255,255,255,0.2);
    z-index: 0;
  }

  /* Floating educational icons */
  .icon {
    position: absolute;
    z-index: 0;
    pointer-events: none;
    opacity: 0.9;
    animation: float ease-in-out infinite;
  }

  @keyframes float {
    0% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-40px) rotate(180deg); }
    100% { transform: translateY(0) rotate(360deg); }
  }

  /* Main Dashboard Container */
  .container {
    position: relative;
    z-index: 2;
    max-width: 900px;
    margin: 60px auto;
    background: rgba(255, 255, 255, 0.95);
    border-radius: 20px;
    padding: 50px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
    text-align: center;
    animation: fadeIn 0.8s ease-in-out;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  .container:hover {
    transform: translateY(-5px);
    box-shadow: 0 25px 50px rgba(0,0,0,0.25);
  }

  /* Welcome Section */
  .welcome-section {
    background: linear-gradient(135deg, #cfe9ff, #eaf6ff);
    border-radius: 20px;
    padding: 25px 30px;
    margin-bottom: 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    box-shadow: 0 8px 25px rgba(0,0,0,0.1);
  }

  .welcome-section h1 {
    font-size: 28px;
    color: #3a6073;
    margin: 0;
    font-weight: 700;
  }

  .logout {
    background: #e74c3c;
    color: #fff;
    padding: 10px 22px;
    border-radius: 10px;
    text-decoration: none;
    font-weight: 600;
    transition: 0.3s;
  }

  .logout:hover {
    background: #c0392b;
    transform: scale(1.05);
    box-shadow: 0 6px 15px rgba(231, 76, 60, 0.3);
  }

  /* Section Titles */
  h3 {
    font-size: 24px;
    margin-bottom: 20px;
    color: #285e8e;
  }

  /* Tests Section */
  .tests-section {
    background: rgba(240, 248, 255, 0.9);
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.1);
  }

  .test-card {
    background: #fff;
    border-radius: 16px;
    padding: 20px;
    margin: 15px 0;
    box-shadow: 0 6px 15px rgba(0,0,0,0.1);
    transition: all 0.3s ease;
  }

  .test-card:hover {
    background: #f0f8ff;
    transform: scale(1.03);
    box-shadow: 0 10px 20px rgba(0,0,0,0.15);
  }

  .test-card h2 {
    font-size: 22px;
    margin-bottom: 10px;
    color: #3a6073;
  }

  .test-card p {
    font-size: 16px;
    margin-bottom: 15px;
    color: #555;
  }

  a.button {
    display: inline-block;
    background: #3a7bd5;
    color: white;
    padding: 12px 25px;
    border-radius: 12px;
    text-decoration: none;
    font-weight: 600;
    transition: 0.3s;
  }

  a.button:hover {
    background: #285e8e;
    transform: scale(1.05);
    box-shadow: 0 8px 20px rgba(58,123,213,0.3);
  }

  footer {
    margin-top: 40px;
    font-size: 12px;
    color: #666;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 600px) {
    .container { padding: 30px 20px; }
    .welcome-section { flex-direction: column; gap: 15px; text-align: center; }
    .welcome-section h1 { font-size: 24px; }
    .test-card h2 { font-size: 20px; }
    .test-card p { font-size: 14px; }
  }
</style>
</head>
<body>

<!-- Floating educational icons -->
<img src="https://img.icons8.com/color/64/graduation-cap.png" class="icon">
<img src="https://img.icons8.com/color/64/book.png" class="icon">
<img src="https://img.icons8.com/color/64/pencil.png" class="icon">
<img src="https://img.icons8.com/color/64/abc.png" class="icon">
<img src="https://img.icons8.com/color/64/laptop.png" class="icon">
<img src="https://img.icons8.com/color/64/teacher.png" class="icon">
<img src="https://img.icons8.com/color/64/math.png" class="icon">
<img src="https://img.icons8.com/color/64/science.png" class="icon">
<img src="https://img.icons8.com/color/64/earth-globe.png" class="icon">
<img src="https://img.icons8.com/color/64/microscope.png" class="icon">
<img src="https://img.icons8.com/color/64/art.png" class="icon">
<img src="https://img.icons8.com/color/64/calculator.png" class="icon">

<!-- Dashboard Content -->
<div class="container">
  <div class="welcome-section">
    <h1>Welcome, {{ student_name }}</h1>
    <a href="{{ url_for('home') }}" class="logout">Logout</a>
  </div>

  <h3>Available Tests</h3>
  <div class="tests-section">
    {% if tests %}
      {% for test in tests %}
        <div class="test-card">
          <h2>{{ test.title }}</h2>
          <p>{{ test.description }}</p>
          <a href="{{ url_for('exam_page', test_id=test.id) }}" class="button">Start Test</a>
        </div>
      {% endfor %}
    {% else %}
      <p>No tests assigned yet. Please wait for your teacher to assign one.</p>
    {% endif %}
  </div>

  <footer>© 2025 iTrack Exam Portal. All rights reserved.</footer>
</div>

<!-- Floating Icon Script -->
<script>
const icons = document.querySelectorAll('.icon');
const safeZone = 500;
const containerCenterX = window.innerWidth / 2;
const containerCenterY = window.innerHeight / 2;

icons.forEach(icon => {
  let x, y;
  do {
    x = Math.random() * window.innerWidth;
    y = Math.random() * window.innerHeight;
  } while (
    x > containerCenterX - safeZone / 2 &&
    x < containerCenterX + safeZone / 2 &&
    y > containerCenterY - safeZone / 2 &&
    y < containerCenterY + safeZone / 2
  );

  icon.style.left = x + 'px';
  icon.style.top = y + 'px';
  const size = 50 + Math.random() * 30;
  icon.style.width = size + 'px';
  icon.style.height = size + 'px';
  icon.style.animationDuration = (6 + Math.random() * 8) + 's';
});
</script>

</body>
</html>
