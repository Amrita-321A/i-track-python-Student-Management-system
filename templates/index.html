<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iTrack - Online Exam Eye Tracker</title>
  <style>
    body {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
    }
    .left {
      width: 48%;
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      padding: 15px;
      text-align: center;
    }
    .right {
      width: 48%;
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      padding: 15px;
    }
    h2 {
      color: #333;
    }
    #status {
      font-weight: bold;
      font-size: 1.2rem;
      margin-top: 10px;
    }
    #status.good { color: green; }
    #status.warn { color: orange; }
    #status.bad { color: red; }
    #timer {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
    }
    iframe {
      width: 100%;
      height: 400px;
      border: none;
    }
  </style>
</head>
<body>

  <div class="left">
    <h2>👁 Eye Tracking Monitor</h2>
    <img id="video" src="{{ url_for('video_feed') }}" width="100%" />
    <p id="status" class="good">Status: Attentive</p>
  </div>

  <div class="right">
    <h2>🧠 Online Exam</h2>

    <!-- Timer display -->
    <div id="timer">05:00</div>

    <form id="examForm">
      <p><b>Question 1:</b> What is the capital of France?</p>
      <input type="text" name="q1" placeholder="Type your answer..." required
             style="width:100%; padding:8px; margin-top:5px;" />
      <br><br>

      <p><b>Question 2:</b> Define the term 'Artificial Intelligence'.</p>
      <textarea name="q2" required style="width:100%; height:100px; padding:8px;"></textarea>
      <br><br>

      <button type="submit" style="padding:10px 20px; background:#007bff; color:white; border:none; border-radius:5px; cursor:pointer;">
        Submit Exam
      </button>
    </form>

    <p id="resultMsg" style="margin-top:15px; font-weight:bold;"></p>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>

  <!-- Countdown Timer Script -->
  <script>
    // 5 minutes = 300 seconds
    let timeLeft = 5 * 60;
    const timerElement = document.getElementById('timer');
    const form = document.getElementById('examForm');

    const countdown = setInterval(() => {
        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;

        // Display timer in MM:SS format
        timerElement.textContent = `${minutes.toString().padStart(2,'0')}:${seconds.toString().padStart(2,'0')}`;

        if (timeLeft <= 0) {
            clearInterval(countdown);
            alert("Time is up! Your exam will be submitted automatically.");
            form.submit();
        }

        timeLeft--;
    }, 1000);
  </script>

</body>
</html>
