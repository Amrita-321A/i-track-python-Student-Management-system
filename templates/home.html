<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>iTrack | Online Exam Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
<style>
  * {margin:0;padding:0;box-sizing:border-box;font-family:"Poppins",sans-serif;}

  body {
    background: linear-gradient(135deg,#87CEFA,#f0f8ff);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    position:relative;
    overflow:hidden;
    color:#333;
  }

  body::before {
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background-color: rgba(255,255,255,0.2);
    z-index:0;
  }

  .icon {
    position:absolute;
    z-index:0;
    pointer-events:none;
    opacity:0.95;
    animation: float ease-in-out infinite;
  }

  @keyframes float {
    0% { transform: translateY(0) rotate(0deg);}
    50% { transform: translateY(-40px) rotate(180deg);}
    100% { transform: translateY(0) rotate(360deg);}
  }

  .container {
    position: relative;
    background: rgba(255,255,255,0.95);
    padding: 50px 40px;
    border-radius: 16px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.25);
    max-width: 400px;
    width: 100%;
    text-align: center;
    z-index:2;
    animation: fadeIn 0.8s ease-in-out;
  }

  .logo {
    font-size:34px;
    font-weight:600;
    color:#3a6073;
    margin-bottom:10px;
  }

  .tagline {
    font-size:14px;
    color:#555;
    margin-bottom:30px;
  }

  .links a {
    display:block;
    text-decoration:none;
    background:#3a7bd5;
    color:#fff;
    padding:14px 0;
    margin:12px 0;
    border-radius:8px;
    font-weight:500;
    transition: background 0.3s ease, transform 0.2s ease, box-shadow 0.2s ease;
  }

  .links a:hover {
    background:#285e8e;
    transform:translateY(-2px);
    box-shadow:0 6px 12px rgba(0,0,0,0.15);
  }

  footer {
    margin-top:30px;
    font-size:12px;
    color:#777;
  }

  @keyframes fadeIn {
    from {opacity:0; transform:translateY(-20px);}
    to {opacity:1; transform:translateY(0);}
  }

  @media(max-width:480px){
    .container{padding:40px 20px;}
    .logo{font-size:28px;}
  }
</style>
</head>
<body>

<div class="container">
  <div class="logo">🎓 iTrack</div>
  <div class="tagline">Your trusted online exam portal</div>
  <div class="links">
    <a href="{{ url_for('login') }}">Admin Login</a>
    <a href="{{ url_for('student_login') }}">Student Login</a>
    <a href="{{ url_for('student_register') }}">Student Register</a>
  </div>
  <footer>© 2025 iTrack Exam Portal. All rights reserved.</footer>
</div>

<!-- Floating educational icons -->
<img src="https://img.icons8.com/color/64/graduation-cap.png" class="icon">
<img src="https://img.icons8.com/color/64/book.png" class="icon">
<img src="https://img.icons8.com/color/64/pencil.png" class="icon">
<img src="https://img.icons8.com/color/64/abc.png" class="icon">
<img src="https://img.icons8.com/color/64/teacher.png" class="icon">
<img src="https://img.icons8.com/color/64/math.png" class="icon">
<img src="https://img.icons8.com/color/64/laptop.png" class="icon">
<img src="https://img.icons8.com/color/64/microscope.png" class="icon">
<img src="https://img.icons8.com/color/64/calculator.png" class="icon">

<script>
const icons = document.querySelectorAll('.icon');
const safeZone = 400;
const containerCenterX = window.innerWidth/2;
const containerCenterY = window.innerHeight/2;

icons.forEach(icon=>{
  let x,y;
  do{
    x = Math.random() * window.innerWidth;
    y = Math.random() * window.innerHeight;
  } while(
    x>containerCenterX - safeZone/2 &&
    x<containerCenterX + safeZone/2 &&
    y>containerCenterY - safeZone/2 &&
    y<containerCenterY + safeZone/2
  );

  icon.style.left = x + 'px';
  icon.style.top = y + 'px';
  
  // bigger size
  const size = 50 + Math.random()*30; // 50-80px
  icon.style.width = size + 'px';
  icon.style.height = size + 'px';
  
  icon.style.animationDuration = (6 + Math.random()*8)+'s';
});
</script>

</body>
</html>
