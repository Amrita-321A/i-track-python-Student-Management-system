<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Assign Test</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #f7971e, #ffd200);
      color: white;
      text-align: center;
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }
    .container {
      max-width: 600px;
      margin: 60px auto;
      background: rgba(255,255,255,0.15);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
      backdrop-filter: blur(10px);
    }
    input, textarea {
      width: 90%;
      padding: 10px;
      margin: 10px 0;
      border: none;
      border-radius: 10px;
      outline: none;
      font-size: 1rem;
    }
    button {
      background: #4caf50;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px 25px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 15px;
      transition: 0.3s;
    }
    button:hover {
      background: #45a049;
    }
    a {
      color: white;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Assign a New Test</h1>
    <form method="POST">
      <input type="text" name="title" placeholder="Test Title" required><br>
      <textarea name="description" placeholder="Description" rows="3"></textarea><br>
     <div id="questions-container">
  <div class="question">
    <input type="text" name="questions[]" placeholder="Enter a question" required>
  </div>
</div>

<button type="button" onclick="addQuestion()">+ Add Question</button>

<script>
function addQuestion() {
  const container = document.getElementById('questions-container');
  const input = document.createElement('input');
  input.type = 'text';
  input.name = 'questions[]';
  input.placeholder = 'Enter a question';
  input.required = true;
  container.appendChild(input);
}
</script>

      <button type="submit">Create Test</button>
    </form>
    <p><a href="{{ url_for('admin_page') }}">← Back to Dashboard</a></p>
  </div>
</body>
</html>
